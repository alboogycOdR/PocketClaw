org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kill Gradle daemon after build to free RAM
org.gradle.daemon=false
org.gradle.daemon.idletimeout=60000
# Keep Android release packaging deterministic on Windows.
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
