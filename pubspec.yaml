name: clawcommander
description: "ClawCommander - Mobile AI Agent Command Centre"
publish_to: 'none'
version: 2.6.2+12

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  flutter_markdown: ^0.7.6
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.2
  connectivity_plus: ^6.1.4
  dartssh2: ^2.10.0  # SSH2 client: exec, SFTP, key auth (Sprint 3)

  # Local Storage
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # YAML parsing (SKILL.md frontmatter)
  yaml: ^3.1.3
  yaml_edit: ^2.2.1

  # Device APIs
  camera: ^0.11.1
  device_calendar: ^4.3.3
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.2.0
  share_plus: ^10.1.4
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

  # Voice input (STT) — device-built-in speech recognition.
  # `record` would be useful for future Whisper / cloud-STT
  # upgrades but its 5.1.2 release pulls a broken
  # record_linux 0.7.2 (missing startStream override) that
  # blocks Android release builds. Add it back when needed,
  # pinning record_linux to a fixed version.
  speech_to_text: ^7.0.0

  # Local LLM — GGUF via fllama only. flutter_gemma removed (see
  # commit log) — was >80MB of native libs, fragile .task format,
  # and GGUF covers the same use cases with a wider model catalogue.
  llamadart: ^0.6.12
  # NOTE: whisper_ggml_plus 1.2.13 ships a CMakeLists.txt whose
  # source globs don't match its actual src/src/ layout — Android
  # build fails at `add_library(whisper ...)` with empty sources.
  # Using the upstream `whisper_ggml` instead; same API surface,
  # works on Android.
  whisper_ggml: ^1.7.0

  # Supertonic TTS (on-device ONNX). Replaces flutter_tts as the
  # primary TTS engine when models are downloaded; flutter_tts stays
  # as the cold-start fallback. ProGuard keep rule for
  # `ai.onnxruntime.**` lives in android/app/proguard-rules.pro.
  flutter_onnxruntime: ^1.7.0
  just_audio: ^0.9.40

  http: ^1.2.0

  # Math
  math_expressions: ^2.6.0

  # Device Info
  device_info_plus: ^11.3.3

  # Battery optimisation exemption + system intents
  android_intent_plus: ^5.2.0

  # Utilities
  uuid: ^4.5.1
  cryptography: ^2.7.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  collection: ^1.19.1
  path: ^1.9.1
  mime: ^2.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/skills/
    - assets/images/.gitkeep
    - assets/model_allowlist.json

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/clawcommander_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/clawcommander_icon_foreground.png"
  remove_alpha_ios: true
