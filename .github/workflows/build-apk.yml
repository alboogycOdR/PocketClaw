name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: master
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze --no-fatal-infos

      # Master-channel Flutter requests NDK 28.0.x, whose license isn't
      # pre-accepted on the GitHub-hosted runner. Without this step the
      # Gradle build fails with LicenceNotAcceptedException.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      # fllama's CMake build expects 3.31.0 specifically (NDK 28 ships with
      # this version). Install both explicitly so Gradle doesn't have to
      # auto-resolve them mid-build.
      - name: Install Android NDK 28 + CMake 3.31.0
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.0.12433566" \
            "cmake;3.31.0"

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          DATE=$(date +%Y%m%d-%H%M)
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/PocketClaw-v${VERSION}-${DATE}.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-claw-apk
          path: build/app/outputs/flutter-apk/PocketClaw-*.apk
          retention-days: 30

      - name: Create GitHub Release (on push to main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Pocket Claw Build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}

            **Changes:** ${{ github.event.head_commit.message }}

            Download the APK below and install on your Android device.
          files: build/app/outputs/flutter-apk/PocketClaw-*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gofile + Telegram delivery — reuses scripts/release_remote.dart so the
      # CI message format matches local releases. Skips silently if the
      # repo secrets are not configured (e.g. forks, PR builds).
      - name: Upload APK to Gofile + notify Telegram
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Telegram secrets not set — skipping Gofile/Telegram delivery."
            echo "Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID under repo Settings → Secrets → Actions to enable."
            exit 0
          fi

          # release_remote.dart reads creds from .env at the project root.
          # Write it just for this step and remove it before the job exits.
          umask 077
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' \
            "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" > .env
          trap 'rm -f .env' EXIT

          dart scripts/release_remote.dart
