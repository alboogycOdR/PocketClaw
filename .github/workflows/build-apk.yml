name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: master
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run analysis
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          DATE=$(date +%Y%m%d-%H%M)
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/PocketClaw-v${VERSION}-${DATE}.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-claw-apk
          path: build/app/outputs/flutter-apk/PocketClaw-*.apk
          retention-days: 30

      - name: Create GitHub Release (on push to main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Pocket Claw Build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}

            **Changes:** ${{ github.event.head_commit.message }}

            Download the APK below and install on your Android device.
          files: build/app/outputs/flutter-apk/PocketClaw-*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
